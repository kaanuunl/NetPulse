[project]
name = "netpulse"
version = "1.0.0"
description = "Per-application network traffic monitor for Windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[project.scripts]
netpulse = "agnabzi.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP007", "UP045", "SIM108"]
